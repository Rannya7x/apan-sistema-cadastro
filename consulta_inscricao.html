<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="consulta_inscricao.css">
    <title>Document</title>
    <script src="src/lib/supabase.js" type="module"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="consulta_inscricao.js"></script>
</head>
<body>
    <div id="tela-consulta" class="tela">
  <header>
    <a href="tela_inicial.html" class="btn-voltar">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Voltar para o Início
    </a>
    <h1>🔍 Consultar Inscrição</h1>
  </header>

  <main>
    <!-- Área de busca -->
    <div id="area-busca">
      <div class="form-group">
        <label for="cpf-consulta">CPF do Atleta</label>
        <input 
          type="text" 
          id="cpf-consulta" 
          placeholder="000.000.000-00" 
          maxlength="14"
        >
      </div>
      <button onclick="filtrarAtletasPorCpf()" id="btn-buscar" class="btn-principal" style="text-align:center;">
        🔍 Buscar Atleta
      </button>
    </div>

    <!-- Área de resultados -->
    <div id="area-resultados" style="display:none">
      <!-- Loading (inicialmente oculto) -->
      <div id="loading-indicator" style="display:none; text-align:center; padding:20px;">
          <div class="spinner"></div>
          <p>Carregando atletas...</p>
      </div>
        <!-- Resultados serão injetados aqui -->
        <div id="resultado-conteudo"></div>
    </div>

    <!-- Área de erro -->
    <div id="area-erro" style="display:none" class="mensagem-erro"></div>
  </main>
</div>
</body>
</html>
