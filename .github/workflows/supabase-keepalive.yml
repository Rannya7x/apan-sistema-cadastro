name: Keep Alive

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 */6 * *'

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          URL=$(echo "${{ secrets.SUPABASE_URL }}" | sed 's:/*$::')
          curl -sS -f -X GET "$URL/rest/v1/keepalive?select=*&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"