name: Keep Supabase Alive

on:
  schedule:
    # Executa a cada 6 dias à meia-noite (UTC)
    - cron: '0 0 */6 * *'
  workflow_dispatch: # Permite execução manual para testes

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        run: |
          # Faz um GET para a tabela 'keepalive', que é uma consulta real ao banco
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/keepalive?select=*&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"