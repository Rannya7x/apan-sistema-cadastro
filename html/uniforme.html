<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uniforme do Atleta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/uniforme.css">
    <!-- Script Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <main class="container">
        <!-- Botão de Voltar para a Tela Inicial -->
        <a href="../index.html" class="btn-voltar">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Voltar para o Início
        </a>

        <header class="form-header">
            <h1>Uniforme</h1>
            <p>Informe os tamanhos da roupa do atleta</p>
        </header>

        <!-- Área de Busca de CPF -->
        <div id="area-busca">
            <div class="form-group">
            <label for="cpf-consulta">CPF do Atleta *</label>
            <input 
                type="text" 
                id="cpf-consulta" 
                placeholder="000.000.000-00" 
                maxlength="14"
                required
            >
            </div>
            <button type="button" id="btn-buscar" class="btn-principal">
            🔍 Buscar Atleta
            </button>

            <!-- Feedback dinâmico da Busca -->
            <div id="resultado-busca" style="margin-top: 14px; display: none;"></div>
        </div>
        
        <fieldset class="form-section">
            <legend>👕 Tamanhos do Uniforme</legend>
            <p class="field-hint" style="margin-bottom: 16px;">Selecione os tamanhos conforme a tabela de medidas da APAN.</p>
            
            <div class="grid-2">
            <!-- Camiseta -->
            <div class="input-group">
                <label for="tamanho_camiseta">Tamanho da Camiseta *</label>
                <select id="tamanho_camiseta" name="tamanho_camiseta" required>
                <option value="">Selecione...</option>
                <option value="PP">PP</option>
                <option value="P">P</option>
                <option value="M">M</option>
                <option value="G">G</option>
                <option value="GG">GG</option>
                <option value="XGG">XGG</option>
                <option value="2GG">2GG</option>
                </select>
            </div>

            <!-- Short -->
            <div class="input-group">
                <label for="tamanho_short">Tamanho do Short *</label>
                <select id="tamanho_short" name="tamanho_short" required>
                <option value="">Selecione...</option>
                <option value="PP">PP</option>
                <option value="P">P</option>
                <option value="M">M</option>
                <option value="G">G</option>
                <option value="GG">GG</option>
                <option value="XGG">XGG</option>
                <option value="2GG">2GG</option>
                </select>
            </div>

            <!-- Tênis -->
            <div class="input-group">
                <label for="tamanho_tenis">Tamanho do Tênis (números) *</label>
                <select id="tamanho_tenis" name="tamanho_tenis" required>
                <option value="">Selecione...</option>
                <option value="31">31</option>
                <option value="32">32</option>
                <option value="33">33</option>
                <option value="34">34</option>
                <option value="35">35</option>
                <option value="36">36</option>
                <option value="37">37</option>
                <option value="38">38</option>
                <option value="39">39</option>
                <option value="40">40</option>
                <option value="41">41</option>
                <option value="42">42</option>
                <option value="43">43</option>
                <option value="44">44</option>
                <option value="45">45</option>
                <option value="46">46</option>
                <option value="47">47</option>
                <option value="48">48</option>
                </select>
            </div>

            <!-- Sapatilha -->
            <div class="input-group">
                <label for="tamanho_sapatilha">Tamanho da Sapatilha *</label>
                <select id="tamanho_sapatilha" name="tamanho_sapatilha" required>
                <option value="">Selecione...</option>
                <option value="31">31</option>
                <option value="32">32</option>
                <option value="33">33</option>
                <option value="34">34</option>
                <option value="35">35</option>
                <option value="36">36</option>
                <option value="37">37</option>
                <option value="38">38</option>
                <option value="39">39</option>
                <option value="40">40</option>
                <option value="41">41</option>
                <option value="42">42</option>
                <option value="43">43</option>
                <option value="44">44</option>
                <option value="45">45</option>
                <option value="46">46</option>
                <option value="47">47</option>
                <option value="48">48</option>
                </select>
            </div>
            </div>

            <!-- Observação sobre tamanhos (opcional) -->
            <div class="input-group full-width" style="margin-top: 12px;">
            <label for="observacao_uniforme">Observações sobre o uniforme</label>
            <textarea 
                id="observacao_uniforme" 
                name="observacao_uniforme" 
                rows="2" 
                placeholder="Ex: Prefiro camiseta mais folgada, tenho calça longa, etc."
                style="width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; resize: vertical;"
            ></textarea>
            </div>
        </fieldset>
    </main>

</body>
</html>
