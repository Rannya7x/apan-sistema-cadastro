<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar Inscrição — APAN</title>

    <!-- Fonte Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS Externo (Com ajuste de pasta ../) -->
    <link rel="stylesheet" href="../css/consulta_inscricao.css">

    <!-- Scripts Supabase e Consulta (Com ajuste de pasta ../) -->
    <script src="../js/src/lib/supabase.js" type="module"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="../js/consulta_inscricao.js"></script>
</head>
<body>

    <main class="container">
        
        <!-- Botão de Voltar Padronizado -->
        <a href="../index.html" class="btn-voltar">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Voltar para o Início
        </a>

        <header class="form-header">
            <h1>Consultar Inscrição</h1>
            <p class="subtitle">Digite o CPF do atleta para visualizar os dados cadastrados</p>
        </header>

        <!-- Área de busca -->
        <div id="area-busca">
            <div class="form-group">
                <label for="cpf-consulta">CPF do Atleta</label>
                <input 
                    type="text" 
                    id="cpf-consulta" 
                    placeholder="000.000.000-00" 
                    maxlength="14"
                >
            </div>
            <button onclick="filtrarAtletasPorCpf()" id="btn-buscar" class="btn-principal">
                🔍 Buscar Atleta
            </button>
        </div>

        <!-- Área de resultados -->
        <div id="area-resultados" style="display:none">
            <!-- Loading (inicialmente oculto) -->
            <div id="loading-indicator" style="display:none; text-align:center; padding:20px;">
                <div class="spinner"></div>
                <p>Carregando dados do atleta...</p>
            </div>
            <!-- Resultados serão injetados via JS -->
            <div id="resultado-conteudo"></div>
        </div>

        <!-- Área de erro -->
        <div id="area-erro" style="display:none" class="mensagem-erro"></div>

    </main>

</body>
</html>
