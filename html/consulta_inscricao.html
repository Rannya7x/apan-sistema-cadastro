<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consultar Inscrição — APAN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/consulta_inscricao.css">
</head>
<body>
  <main class="container">
    <a href="../home.html" id="btn-voltar-painel" class="btn-voltar">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      <span id="texto-voltar">Voltar para o Início</span>
    </a>

    <header class="form-header">
      <h1 id="titulo-consulta">Minha Inscrição</h1>
      <p class="subtitle" id="consulta-subtitle">Carregando seus dados cadastrados...</p>
    </header>

    <div id="area-busca" style="display:none">
      <div class="form-group">
        <label for="cpf-consulta">Filtrar por CPF</label>
        <input type="text" id="cpf-consulta" placeholder="000.000.000-00" maxlength="14">
      </div>
      <button type="button" id="btn-buscar" class="btn-principal">🔍 Buscar Atleta</button>
    </div>

    <div id="area-resultados" style="display:none">
      <div id="loading-indicator" style="display:none; text-align:center; padding:20px;">
        <div class="spinner"></div>
        <p>Carregando dados do atleta...</p>
      </div>
      <div id="resultado-conteudo"></div>
    </div>

    <div id="area-erro" style="display:none" class="mensagem-erro"></div>
  </main>

  <script type="module" src="../js/consulta_inscricao.js"></script>
</body>
</html>
