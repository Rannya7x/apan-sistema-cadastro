<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição Unificada — APAN</title>
    <!-- Vinculando o arquivo CSS externo -->
    <link rel="stylesheet" href="/css/inscricao.css">
</head>
<body>

    <main class="container">
        
        <!-- Botão de Voltar para a Tela Inicial -->
        <a href="../index.html" class="btn-voltar">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Voltar para o Início
        </a>

        <header class="form-header">
            <h1>Inscrição Unificada</h1>
            <p>APAN & Iniciação ao Atletismo</p>
        </header>

        <form action="" method="post" enctype="multipart/form-data">
            
            <!-- Dados Pessoais -->
            <div class="form-group">
                <label for="nome">Nome Completo *</label>
                <input type="text" id="nome" name="nome" placeholder="Ex: João Silva" required>
            </div>

            <!-- CPF (Máximo 14 caracteres com a formatação: 000.000.000-00) -->
            <div class="form-group">
                <label for="cpf">CPF *</label>
                <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" required>
            </div>

            <!-- Data de Nascimento -->
            <div class="form-group">
                <label for="datanascimento">Data de Nascimento *</label>
                <input type="date" id="datanascimento" name="datanascimento" required>
            </div>

            <!-- Campo Dinâmico: Nome do Responsável (Exibido Apenas para Menores de 18 anos) -->
            <div class="form-group conditional-field" id="campo-responsavel">
                <label for="nomeresponsavel">Nome do Responsável *</label>
                <input type="text" id="nomeresponsavel" name="nomeresponsavel" placeholder="Ex: Maria Silva">
            </div>

            <div class="form-group">
                <label for="email">E-mail de Contato *</label>
                <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
            </div>

            <!-- WhatsApp (Máximo 15 caracteres com a formatação: (00) 90000-0000) -->
            <div class="form-group">
                <label for="whatsapp">WhatsApp *</label>
                <input type="tel" id="whatsapp" name="whatsapp" placeholder="(00) 90000-0000" maxlength="15" required>
            </div>

            <!-- Módulo de Inscrição -->
            <div class="form-group">
                <label class="group-title">Selecione o módulo que deseja se inscrever *</label>
                <div class="radio-options vertical">
                    <label class="radio-card">
                        <input type="radio" name="modulo" value="preinscricao" required>
                        <span>Apenas Pré-Inscrição APAN</span>
                    </label>
                    <label class="radio-card">
                        <input type="radio" name="modulo" value="atletismo" required>
                        <span>Apenas Iniciação ao Atletismo</span>
                    </label>
                    <label class="radio-card">
                        <input type="radio" name="modulo" value="ambos" required>
                        <span>Ambas as inscrições</span>
                    </label>
                </div>
            </div>

            <!-- Campo Dinâmico: Upload de Foto (Exibido para APAN ou Ambos) -->
            <div class="form-group conditional-field" id="campo-foto">
                <label for="foto">Foto do Atleta (3x4 ou similar) *</label>
                <input type="file" id="foto" name="foto" accept="image/*">
                <small class="help-text">Acima do ombro com fundo branco, tirada no celular.</small>
            </div>

            <!-- Deficiência -->
            <div class="form-group">
                <label class="group-title">Possui deficiência? *</label>
                <div class="radio-options horizontal">
                    <label class="radio-card">
                        <input type="radio" name="deficiencia" value="sim" required>
                        <span>Sim</span>
                    </label>
                    <label class="radio-card">
                        <input type="radio" name="deficiencia" value="nao" required>
                        <span>Não</span>
                    </label>
                </div>
            </div>

            <!-- Campo Dinâmico: Tipo de Deficiência (Exibido se Responder SIM) -->
            <div class="form-group conditional-field" id="campo-tipo-deficiencia">
                <label class="group-title">Informe a deficiência *</label>
                <div class="radio-options grid-2">
                    <label class="radio-card"><input type="radio" name="tipo_deficiencia" value="intelectual"> <span>Intelectual</span></label>
                    <label class="radio-card"><input type="radio" name="tipo_deficiencia" value="andante"> <span>Física - Andante</span></label>
                    <label class="radio-card"><input type="radio" name="tipo_deficiencia" value="cadeirante"> <span>Física - Cadeirante</span></label>
                    <label class="radio-card"><input type="radio" name="tipo_deficiencia" value="visual"> <span>Visual</span></label>
                    <label class="radio-card"><input type="radio" name="tipo_deficiencia" value="auditiva"> <span>Auditiva</span></label>
                    <label class="radio-card"><input type="radio" name="tipo_deficiencia" value="autismo"> <span>Autismo</span></label>
                    <label class="radio-card"><input type="radio" name="tipo_deficiencia" value="down"> <span>Síndrome de Down</span></label>
                    <label class="radio-card"><input type="radio" name="tipo_deficiencia" value="tea"> <span>TEA</span></label>
                </div>
            </div>

            <!-- Equipamentos Auxiliares -->
            <div class="form-group">
                <label class="group-title">Necessita uso de equipamentos auxiliares? *</label>
                <div class="radio-options horizontal">
                    <label class="radio-card">
                        <input type="radio" name="equipamentos" value="sim" required>
                        <span>Sim</span>
                    </label>
                    <label class="radio-card">
                        <input type="radio" name="equipamentos" value="nao" required>
                        <span>Não</span>
                    </label>
                </div>
            </div>

            <!-- Campo Dinâmico: Qual Equipamento (Exibido se Responder SIM) -->
            <div class="form-group conditional-field" id="campo-qual-equipamento">
                <label for="qual_equipamento">Informe qual equipamento é necessário *</label>
                <input type="text" id="qual_equipamento" name="qual_equipamento" placeholder="Ex: Cadeira de rodas, muletas, prótese...">
            </div>

            <button type="submit" class="btn-submit">Enviar Inscrição</button>
            
        </form>
    </main>

   <!-- SDK do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Seu código JS fica aqui, antes do fim do body -->
    <script src="/js/inscricao.js"></script>

</body>
</html>
